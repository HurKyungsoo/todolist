name: todolist

services:
  mysql:
    image: mysql:8.0
    container_name: todolist-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-todolist}
      MYSQL_USER: ${DB_USERNAME:-todouser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-todopass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: ./backend
    container_name: todolist-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-todolist}
      DB_USERNAME: ${DB_USERNAME:-todouser}
      DB_PASSWORD: ${DB_PASSWORD:-todopass}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (min 32 bytes)}
      # 프론트를 nginx 뒤에서 같은 오리진(/api)으로 서빙하므로 CORS 는 사실상 불필요.
      # 백엔드 API 를 직접 호출하는 도메인이 있으면 여기에 추가.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    # Swagger UI 를 서버에서 직접 확인하려면 노출 (보안그룹 8080 개방 필요). 불필요하면 삭제.
    ports:
      - "8080:8080"

  web:
    build: ./frontend
    container_name: todolist-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    environment:
      BACKEND_URL: http://app:8080

volumes:
  mysql_data:
